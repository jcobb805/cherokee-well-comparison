<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dusty 1H vs 2H — Mewbourne</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1419; --panel: #171c24; --panel2: #1f2630; --border: #2a313c;
    --text: #e6edf3; --muted: #8b98a5; --accent: #ffb347;
    --w1: #ffb347; --w2: #5ac8fa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { padding: 22px 28px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; }
  nav { padding: 10px 28px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; gap: 8px; }
  nav a { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; }
  nav a:hover { background: var(--panel2); color: var(--text); }
  nav a.active { background: var(--accent); color: #1a1206; font-weight: 600; }
  main { padding: 18px 28px 40px; max-width: 1680px; margin: 0 auto; }
  .callout { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 12px 16px; margin-bottom: 18px; font-size: 13px; color: var(--text); }
  .summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
  @media (max-width: 800px) { .summary { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .card h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .stats { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
  .stats span { color: var(--muted); }
  .stats b { text-align: right; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  .chart-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .chart-card h3 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
  .chart-card .unit { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 6px; }
  .chart-wrap { position: relative; height: 340px; }
  footer { padding: 18px 28px 40px; color: var(--muted); font-size: 12px; max-width: 1680px; margin: 0 auto; }
  /* frac table */
  .frac-grid { display: grid; grid-template-columns: 240px repeat(2, minmax(0, 1fr)); font-size: 13px; }
  .frac-grid > div { padding: 8px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .frac-grid .frac-row-head { color: var(--muted); }
  .frac-grid .frac-col-head { color: var(--text); font-weight: 600; border-bottom: 2px solid var(--border); }
  .frac-bar { position: relative; flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
  .frac-bar > span { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
  .frac-val { min-width: 80px; text-align: right; font-variant-numeric: tabular-nums; }
  .frac-empty { color: var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <h1>Dusty 1H vs 2H</h1>
    <div class="meta" id="subtitle"></div>
  </div>
  <div class="meta" id="generated"></div>
</header>

<nav>
  <a href="index.html">Beaty / Malson / Quetzal</a>
  <a href="dusty.html" class="active">Dusty 1H vs 2H</a>
</nav>

<main>
  <div class="callout" id="callout"></div>
  <section class="summary" id="summary"></section>

  <section class="chart-card" style="margin-bottom:18px">
    <h3>Frac Intensity <span class="unit">Enverus completion data</span></h3>
    <div id="frac-table"></div>
  </section>

  <section class="grid">
    <div class="chart-card">
      <h3>Oil Rate <span class="unit">BOPD — monthly calendar-day avg</span></h3>
      <div class="chart-wrap"><canvas id="chart-bopd"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>Gas Rate <span class="unit">MCFD — monthly calendar-day avg</span></h3>
      <div class="chart-wrap"><canvas id="chart-mcfd"></canvas></div>
    </div>
  </section>
</main>

<footer id="footer"></footer>

<script>
const DATA = {"title":"Dusty 1H vs 2H \u2014 Mewbourne (Dewey Co, OK)","subtitle":"Surface 18N-16W Sec 31; laterals run S into Sec 6/7 of 17N-16W. Red Fork. Enverus state production (monthly).","source":"Enverus Developer API v3 \u2014 production + wells endpoints","wells":[{"id":"dusty_1h","name":"Dusty 6/7 BP 1H","api":"35-043-23806","color":"#ffb347","operator":"MEWBOURNE OIL","location":"18N-16W-31","first_prod_date":"2025-10-01","last_report":"2026-02","months_reported":5,"cum_bo":48708,"cum_mcf":111887,"peak_bopd":458.81,"peak_mcfd":1060.77,"data":[{"date":"2025-10-15","bopd":241.23,"mcfd":380.97},{"date":"2025-11-15","bopd":429.17,"mcfd":641.13},{"date":"2025-12-15","bopd":458.81,"mcfd":1060.77},{"date":"2026-01-15","bopd":272.55,"mcfd":850.35},{"date":"2026-02-15","bopd":202.96,"mcfd":771.36}],"months":[{"month":"2025-10-01","producing_days":31,"oil_bbl":7478,"gas_mcf":11810,"water_bbl":0,"cd_bopd":241.23,"cd_mcfd":380.97},{"month":"2025-11-01","producing_days":30,"oil_bbl":12875,"gas_mcf":19234,"water_bbl":0,"cd_bopd":429.17,"cd_mcfd":641.13},{"month":"2025-12-01","producing_days":31,"oil_bbl":14223,"gas_mcf":32884,"water_bbl":0,"cd_bopd":458.81,"cd_mcfd":1060.77},{"month":"2026-01-01","producing_days":31,"oil_bbl":8449,"gas_mcf":26361,"water_bbl":0,"cd_bopd":272.55,"cd_mcfd":850.35},{"month":"2026-02-01","producing_days":28,"oil_bbl":5683,"gas_mcf":21598,"water_bbl":0,"cd_bopd":202.96,"cd_mcfd":771.36}],"frac":{"operator":"MEWBOURNE OIL","interval":"RED FORK","formation":"CHEROKEE","location":"18N-16W-31","spud_date":"2025-05-02","completion_date":"2025-10-07","first_prod_date":"2025-10-01","lateral_ft":9903,"tvd_ft":9415.52,"proppant_lbs":12134165,"proppant_intensity_lbs_per_ft":1229.7725,"fluid_bbl":284273,"fluid_intensity_bbl_per_ft":28.81048,"water_intensity_gal_per_ft":1210.0402,"frac_job_type":"SLICKWATER HC","fluid_type":"FRESH WATER","proppant_type":"SAND ONLY"}},{"id":"dusty_2h","name":"Dusty 6/7 CO 2H","api":"35-043-23805","color":"#5ac8fa","operator":"MEWBOURNE OIL","location":"18N-16W-31","first_prod_date":"2025-10-01","last_report":"2026-02","months_reported":5,"cum_bo":270299,"cum_mcf":373582,"peak_bopd":2121.19,"peak_mcfd":4483.36,"data":[{"date":"2025-10-15","bopd":1697.23,"mcfd":1420.16},{"date":"2025-11-15","bopd":1468.8,"mcfd":1304},{"date":"2025-12-15","bopd":2121.19,"mcfd":2116.26},{"date":"2026-01-15","bopd":2051.9,"mcfd":3203.19},{"date":"2026-02-15","bopd":1580.54,"mcfd":4483.36}],"months":[{"month":"2025-10-01","producing_days":31,"oil_bbl":52614,"gas_mcf":44025,"water_bbl":0,"cd_bopd":1697.23,"cd_mcfd":1420.16},{"month":"2025-11-01","producing_days":30,"oil_bbl":44064,"gas_mcf":39120,"water_bbl":0,"cd_bopd":1468.8,"cd_mcfd":1304},{"month":"2025-12-01","producing_days":31,"oil_bbl":65757,"gas_mcf":65604,"water_bbl":0,"cd_bopd":2121.19,"cd_mcfd":2116.26},{"month":"2026-01-01","producing_days":31,"oil_bbl":63609,"gas_mcf":99299,"water_bbl":0,"cd_bopd":2051.9,"cd_mcfd":3203.19},{"month":"2026-02-01","producing_days":28,"oil_bbl":44255,"gas_mcf":125534,"water_bbl":0,"cd_bopd":1580.54,"cd_mcfd":4483.36}],"frac":{"operator":"MEWBOURNE OIL","interval":"RED FORK","formation":"CHEROKEE","location":"18N-16W-31","spud_date":"2025-05-01","completion_date":"2025-10-07","first_prod_date":"2025-10-01","lateral_ft":9997,"tvd_ft":9367.25,"proppant_lbs":12026222,"proppant_intensity_lbs_per_ft":1216.7363,"fluid_bbl":284187,"fluid_intensity_bbl_per_ft":28.752226,"water_intensity_gal_per_ft":1207.5935,"frac_job_type":"SLICKWATER HC","fluid_type":"FRESH WATER","proppant_type":"SAND ONLY"}}]};
function getCSS(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function fmt(n){ if(n==null||isNaN(n))return "—";
  if(Math.abs(n)>=1e6)return (n/1e6).toFixed(2)+"M";
  if(Math.abs(n)>=1e3)return (n/1e3).toFixed(n>=10000?0:1)+"k";
  return n.toLocaleString(undefined,{maximumFractionDigits:0}); }

document.getElementById("subtitle").textContent = DATA.subtitle;
document.getElementById("generated").textContent = DATA.source;
document.getElementById("footer").textContent =
  "Source: " + DATA.source + ". State production is reported monthly; rates shown are calendar-day averages per producing month. Water not reported in state filings.";

// Callout — compare fracs vs production
(function(){
  const [a,b] = DATA.wells;
  const el = document.getElementById("callout");
  el.innerHTML = `<b>Same frac, different rock.</b> Both wells share a pad and were completed the same day with
    near-identical jobs (~${fmt(a.frac.proppant_intensity_lbs_per_ft)} vs ~${fmt(b.frac.proppant_intensity_lbs_per_ft)} lbs/ft proppant,
    ~${a.frac.fluid_intensity_bbl_per_ft.toFixed(1)} vs ~${b.frac.fluid_intensity_bbl_per_ft.toFixed(1)} bbl/ft fluid),
    yet ${b.name} peaks at ${fmt(b.peak_bopd)} BOPD vs ${fmt(a.peak_bopd)} BOPD for ${a.name} —
    a ~${(b.peak_bopd/a.peak_bopd).toFixed(1)}x oil difference driven by landing zone, not completion design.`;
})();

// Summary cards
const summaryEl = document.getElementById("summary");
DATA.wells.forEach(w => {
  const el = document.createElement("div");
  el.className = "card";
  el.innerHTML = `
    <h3><span class="swatch" style="background:${w.color}"></span>${w.name}</h3>
    <div class="sub">${w.operator} · ${w.location} · ${w.frac.interval || ""} · API ${w.api}</div>
    <div class="stats">
      <span>First prod</span><b>${w.first_prod_date || "—"}</b>
      <span>Last report</span><b>${w.last_report || "—"}</b>
      <span>Months reported</span><b>${w.months_reported}</b>
      <span>Peak BOPD (mo avg)</span><b>${fmt(w.peak_bopd)}</b>
      <span>Peak MCFD (mo avg)</span><b>${fmt(w.peak_mcfd)}</b>
      <span>Cum oil (bbl)</span><b>${fmt(w.cum_bo)}</b>
      <span>Cum gas (Mcf)</span><b>${fmt(w.cum_mcf)}</b>
    </div>`;
  summaryEl.appendChild(el);
});

// Frac table
const FRAC_ROWS = [
  { key:"operator", label:"Operator", fmt:"text" },
  { key:"interval", label:"Interval", fmt:"text" },
  { key:"location", label:"Twp-Rng-Sec (surface)", fmt:"text" },
  { key:"spud_date", label:"Spud date", fmt:"text" },
  { key:"completion_date", label:"Completion date", fmt:"text" },
  { key:"lateral_ft", label:"Lateral length (ft)", fmt:"int", bar:true },
  { key:"tvd_ft", label:"TVD (ft)", fmt:"int" },
  { key:"proppant_lbs", label:"Total proppant (lbs)", fmt:"int", bar:true },
  { key:"proppant_intensity_lbs_per_ft", label:"Proppant intensity (lbs/ft)", fmt:"int", bar:true },
  { key:"fluid_bbl", label:"Total fluid (bbl)", fmt:"int", bar:true },
  { key:"fluid_intensity_bbl_per_ft", label:"Fluid intensity (bbl/ft)", fmt:"1dec", bar:true },
  { key:"water_intensity_gal_per_ft", label:"Water intensity (gal/ft)", fmt:"int", bar:true },
  { key:"frac_job_type", label:"Frac job type", fmt:"text" },
  { key:"proppant_type", label:"Proppant type", fmt:"text" },
];
function fracVal(v,t){ if(v==null||v==="")return null;
  if(t==="int")return Math.round(v).toLocaleString();
  if(t==="1dec")return Number(v).toFixed(1);
  return String(v); }
(function(){
  const host = document.getElementById("frac-table");
  const grid = document.createElement("div");
  grid.className = "frac-grid";
  const sp = document.createElement("div"); sp.className = "frac-col-head"; grid.appendChild(sp);
  DATA.wells.forEach(w => {
    const h = document.createElement("div"); h.className = "frac-col-head";
    h.innerHTML = `<span class="swatch" style="background:${w.color}"></span>${w.name}`;
    grid.appendChild(h);
  });
  FRAC_ROWS.forEach(row => {
    const lab = document.createElement("div"); lab.className = "frac-row-head"; lab.textContent = row.label; grid.appendChild(lab);
    let max = 0;
    if (row.bar) DATA.wells.forEach(w => { const v = w.frac[row.key]; if (typeof v==="number" && v>max) max=v; });
    DATA.wells.forEach(w => {
      const cell = document.createElement("div");
      const raw = w.frac[row.key];
      const disp = fracVal(raw, row.fmt);
      if (disp == null) cell.innerHTML = `<span class="frac-empty">—</span>`;
      else if (row.bar && typeof raw==="number" && max>0) {
        const pct = (raw/max)*100;
        cell.innerHTML = `<div class="frac-bar"><span style="width:${pct}%;background:${w.color}"></span></div><div class="frac-val">${disp}</div>`;
      } else cell.innerHTML = `<div class="frac-val" style="text-align:left">${disp}</div>`;
      grid.appendChild(cell);
    });
  });
  host.appendChild(grid);
})();

// Build a shared, sorted month axis (both wells share the same months)
const MONTH_KEYS = [...new Set(DATA.wells.flatMap(w => w.months.map(m => m.month.slice(0,7))))].sort();
const MONTH_LABELS = MONTH_KEYS.map(k => {
  const [y,m] = k.split("-");
  return new Date(y, m-1, 1).toLocaleDateString(undefined, { year: "numeric", month: "short" });
});

function makeChart(id, key, yLabel){
  const ctx = document.getElementById(id).getContext("2d");
  const datasets = DATA.wells.map(w => {
    const byMonth = {};
    w.months.forEach(m => { byMonth[m.month.slice(0,7)] = (key === "bopd" ? m.cd_bopd : m.cd_mcfd); });
    return {
      label: w.name,
      data: MONTH_KEYS.map(k => byMonth[k] ?? null),
      borderColor: w.color,
      backgroundColor: w.color + "33",
      pointRadius: 4, pointHoverRadius: 6, borderWidth: 2.4, tension: 0.25, spanGaps: true,
    };
  });
  new Chart(ctx, {
    type: "line",
    data: { labels: MONTH_LABELS, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { labels: { color: getCSS("--text"), boxWidth: 12, usePointStyle: true } },
        tooltip: { backgroundColor: "#0b0f14", borderColor: getCSS("--border"), borderWidth: 1,
          titleColor: getCSS("--text"), bodyColor: getCSS("--text"),
          callbacks: { label: c => `${c.dataset.label}: ${fmt(c.parsed.y)}` } },
      },
      scales: {
        x: { title: { display: true, color: getCSS("--muted"), text: "Producing month" },
             ticks: { color: getCSS("--muted") }, grid: { color: "rgba(255,255,255,0.05)" } },
        y: { beginAtZero: true, title: { display: true, color: getCSS("--muted"), text: yLabel },
             ticks: { color: getCSS("--muted"), callback: v => fmt(v) }, grid: { color: "rgba(255,255,255,0.06)" } },
      },
    },
  });
}
makeChart("chart-bopd", "bopd", "BOPD (bbl/day)");
makeChart("chart-mcfd", "mcfd", "MCFD (Mcf/day)");
</script>
</body>
</html>
